version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: exportvid
      POSTGRES_PASSWORD: exportvid
      POSTGRES_DB: exportvid
    ports:
      - '5432:5432'
    volumes:
      - exportvid_pg:/var/lib/postgresql/data

  redis:
    image: valkey/valkey:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  exportvid_pg:
